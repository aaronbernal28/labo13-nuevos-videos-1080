[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labo13"
version = "0.1.0"
description = "Core domain library for LABO 13 pendulum video tracking and nonlinear oscillation analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"av>=12.0",
	"gdown>=5.1",
	"matplotlib>=3.7",
	"numpy>=1.24",
	"pandas>=2.0",
	"pillow>=10.0",
	"scikit-image>=0.22",
	"scipy>=1.10",
	"tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
	"jsonschema>=4.20",
	"mypy>=1.10",
	"pandas-stubs>=2.0",
	"pytest>=8.0",
	"ruff>=0.4",
	"snakemake>=8.0",
	"types-Pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labo13"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
	"av.*",
	"gdown.*",
	"matplotlib.*",
	"scipy.*",
	"skimage.*",
	"snakemake.*",
	"tqdm.*",
]
ignore_missing_imports = true
