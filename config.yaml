paths:
  videos_dir: "media/raw/videos"
  images_dir: "media/raw/images"
  frames_dir: "media/frames"
  trajectories_csv: "results/trajectories.csv"
  plots_dir: "results/plots"
  logs_dir: "logs"
  benchmarks_dir: "benchmarks"

parameters:
  background_image_key: "superfotograma"
  fps: 60
  threshold_low: 20.0
  threshold_high: 255.0
  morphology_disk_radius: 3
  morphology_opening_disk_radius: 6
  roi_y_start: 1180
  roi_y_end: 2080
  roi_x_start: 200
  roi_x_end: 3500
  frame_batch_size: 64
  png_compress_level: 1

